name: Book

# Build every edition of the book (print interior, cover wrap, EPUB, colour
# reading PDF), check the EPUB, and publish the website with the downloads on
# GitHub Pages. A tag such as v1.0.0 also creates a GitHub release with the files.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-inter fonts-jetbrains-mono fonts-dejavu
          wget -q https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
          sudo dpkg -i pandoc-3.1.3-1-amd64.deb
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install pyyaml==6.0.3 beautifulsoup4==4.15.0 pypdf==6.17.0 pillow==12.3.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Chromium for PDF rendering
        run: |
          npm install --prefix book/build-book playwright@1.63.0
          npx --prefix book/build-book playwright install --with-deps chromium
      - name: Build the book
        # the cover script renders from a file in out/, so tell node where Playwright is
        env:
          NODE_PATH: ${{ github.workspace }}/book/build-book/node_modules
        run: book/build-book/build.sh book/manuscript out
      - name: Check the EPUB
        run: |
          wget -q https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck-5.1.0.zip
          java -jar epubcheck-5.1.0/epubcheck.jar out/the-nanosecond-budget.epub
      - name: Build the website
        run: python3 book/site/build_site.py book/manuscript out site
      - name: Keep the print files
        uses: actions/upload-artifact@v4
        with:
          name: print-files
          path: |
            out/interior.pdf
            out/cover/cover-wrap.pdf
            out/the-nanosecond-budget.epub
            out/the-nanosecond-budget.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/the-nanosecond-budget.pdf
            out/the-nanosecond-budget.epub
            site/downloads/llds-book-code.zip

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
